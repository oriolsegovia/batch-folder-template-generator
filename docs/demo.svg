  <text x="160" y="378" font-family="Segoe UI, Arial" font-size="13" fill="#64748b">Paste one numeric ID per line. No artificial limit.</text>
  <rect x="160" y="394" width="868" height="92" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="178" y="420" font-family="Consolas, monospace" font-size="15" fill="#334155">100001</text>
  <text x="178" y="444" font-family="Consolas, monospace" font-size="15" fill="#334155">100002</text>
